<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>El Ai</title>
  <meta name="description" content="El Ai — asisten AI berbahasa Indonesia untuk bertanya, menulis, belajar, dan coding.">
  <meta name="theme-color" content="#101312">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="game.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('elai.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="booting">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Riwayat obrolan">
      <div class="side-head">
        <div class="brand"><span class="logo">El</span><span class="brand-name">El Ai</span></div>
        <button class="icon-btn only-mobile" id="closeSide" type="button" aria-label="Tutup menu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Obrolan baru
      </button>

      <button class="new-chat study-entry" id="studyBtn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        Mode Belajar
      </button>

      <div class="side-label">Terbaru</div>
      <nav class="chat-list" id="chatList"></nav>

      <div class="side-foot">
        <div class="quota" id="quota" hidden>
          <div class="q-row"><span>Kuota hari ini</span><b id="qText">–</b></div>
          <div class="q-bar"><i id="qFill"></i></div>
          <div class="q-sub" id="qSub"></div>
          <button class="q-up" id="upgradeBtn" type="button">Tambah kuota</button>
        </div>
        <div class="acct" id="acct" hidden>
          <button class="acct-btn" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="avatar" id="avatar">?</span>
            <span class="acct-txt"><strong id="acctName"></strong><small id="acctPlan"></small></span>
          </button>
          <div class="acct-menu" id="acctMenu" role="menu" hidden>
            <a role="menuitem" id="adminLink" href="/admin.html" hidden>Panel admin</a>
            <button role="menuitem" type="button" id="logoutBtn">Keluar</button>
          </div>
        </div>
        <button class="ghost-btn" id="themeBtn" type="button">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="themeLabel">Mode gelap</span>
        </button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="openSide" type="button" aria-label="Buka menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="top-title" id="topTitle">El Ai</div>
        <span class="top-spacer"></span>
        <div class="tier" id="tier">
          <button class="tier-btn" id="tierBtn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Pilih tingkatan AI">
            <span id="tierLabel">El Pro</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="tier-menu" id="tierMenu" role="listbox" hidden></div>
        </div>
        <button class="icon-btn light-btn" id="lightBtn" type="button" aria-label="Nyalakan senter" title="Senter">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6v4l2 3v3H7V9l2-3z"/><path d="M7 12v8a2 2 0 002 2h6a2 2 0 002-2v-8M12 15v2"/></svg>
        </button>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="hello">
            <span class="logo logo-lg">El</span>
            <h1 id="greeting">Halo, ada yang bisa El bantu?</h1>
          </div>
          <div class="chips" id="chips">
            <button type="button" class="chip" id="studyChip">
              <strong>Mode Belajar</strong><span>Rekam suara kuliah, lalu rangkum</span>
            </button>
            <button type="button" class="chip" data-prompt="Apa itu El Ai?">
              <strong>Apa itu El Ai?</strong><span>Kenalan dulu dengan asisten ini</span>
            </button>
            <button type="button" class="chip" data-prompt="Jelaskan apa itu kecerdasan buatan dengan bahasa yang sederhana.">
              <strong>Belajar hal baru</strong><span>Jelaskan AI dengan bahasa sederhana</span>
            </button>
            <button type="button" class="chip" data-prompt="Bantu saya menulis email profesional untuk izin tidak masuk kerja besok.">
              <strong>Bantu menulis</strong><span>Email profesional untuk izin kerja</span>
            </button>
            <button type="button" class="chip" data-prompt="Buatkan contoh fungsi JavaScript untuk menghitung rata-rata dari array angka, lengkap dengan penjelasan.">
              <strong>Coding</strong><span>Fungsi JavaScript hitung rata-rata</span>
            </button>
          </div>
        </div>
        <div class="thread" id="thread"></div>
      </section>

      <div class="composer-wrap">
        <div class="slash-menu" id="slashMenu" role="listbox" aria-label="Perintah" hidden></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="tray" id="tray" hidden></div>
          <div class="composer-row">
            <button class="attach" id="attachBtn" type="button" aria-label="Lampirkan foto atau file" title="Lampirkan foto atau file">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Tanya apa saja ke El Ai…" aria-label="Pesan" maxlength="6000"></textarea>
            <button class="send" id="send" type="submit" aria-label="Kirim" disabled>
              <svg class="i-send" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
          <input type="file" id="fileInput" hidden multiple
                 accept="image/*,.pdf,.txt,.md,.markdown,.csv,.tsv,.json,.xml,.yaml,.yml,.log,.html,.css,.js,.mjs,.ts,.tsx,.jsx,.py,.java,.c,.h,.cpp,.cs,.go,.rs,.php,.rb,.sql,.sh,.ini,.toml,.env,text/*">
        </form>
        <p class="disclaimer">El Ai bisa saja keliru. Periksa kembali informasi yang penting.</p>
      </div>
    </main>
  </div>

  <div class="light-bar" id="lightBar" hidden><span>Senter menyala</span><button type="button" id="lightOff">Matikan</button></div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <!-- account.js memeriksa login dulu, lalu memuat markdown.js, convert.js, study.js, app.js -->
  <script src="account.js"></script>
</body>
</html>
